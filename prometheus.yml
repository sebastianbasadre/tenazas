global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - "/etc/prometheus/alerts.yml"
scrape_configs:
  - job_name: "tenazas"
    static_configs:
      - targets: ["host.docker.internal:9105"]
        labels:
          instance: "openclaw"
  - job_name: "homelab"
    static_configs:
      - targets: ["192.168.2.6:9182"]
        labels:
          instance: "homelab"
  - job_name: "homelab_gpu"
    static_configs:
      - targets: ["192.168.2.6:9835"]
        labels:
          instance: "homelab"
  - job_name: "tenazas_api_calls"
    scrape_interval: 30s
    static_configs:
      - targets: ["host.docker.internal:9106"]
        labels:
          instance: "openclaw"
  - job_name: 'tenazas_multitool_eval'
    scrape_interval: 300s
    static_configs:
      - targets: ["host.docker.internal:9107"]
        labels:
          instance: "openclaw"
  - job_name: 'tenazas_network'
    scrape_interval: 30s
    static_configs:
      - targets: ["host.docker.internal:9108"]
        labels:
          instance: "openclaw"
  - job_name: 'tenazas_finance'
    scrape_interval: 300s
    static_configs:
      - targets: ["host.docker.internal:9109"]
        labels:
          instance: "openclaw"
