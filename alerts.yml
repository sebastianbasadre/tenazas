groups:
  - name: tenazas_alerts
    rules:
      - alert: TenazasSupervisorStale
        expr: (time() - tenazas_service_supervisor_timestamp) > 90 or absent(tenazas_service_supervisor_timestamp)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Supervisor sin heartbeat"
      - alert: TenazasRuntimeCycleStale
        expr: (time() - tenazas_runtime_last_success_timestamp) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agentes sin ciclo exitoso en 15 minutos"
      - alert: TenazasInfraAgentStale
        expr: (time() - tenazas_background_last_success_timestamp{agent="infra_watcher"}) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agente de infraestructura sin ejecucion exitosa"
      - alert: TenazasNetworkScanStale
        expr: (time() - tenazas_network_last_scan_timestamp) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Network scan stale (>15 min)"
          description: "Último scan de red hace {{ $value | humanizeDuration }}. Revisar cron o router."

      - alert: TenazasIOLTokenExpired
        expr: (time() - iol_portfolio_last_success_ts) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "IOL data stale (>10 min)"
          description: "Última colección IOL hace {{ $value | humanizeDuration }}. Probablemente token expirado."

      - alert: TenazasEvalExporterDown
        expr: tenazas_eval_exporter_up == 0 or absent(tenazas_eval_exporter_up)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Eval exporter caído"
          description: "El exporter de métricas eval en :9107 no responde."

      - alert: TenazasEvalF1BelowThreshold
        expr: tenazas_eval_f1{model="finetuned"} < 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "F1 del modelo finetuned por debajo de 0.5"
          description: "F1 actual: {{ $value }}. El modelo finetuned tiene performance inaceptable."

      - alert: TenazasEvalFinetunedWorseThanBaseline
        expr: tenazas_eval_f1{model="finetuned"} < tenazas_eval_f1{model="baseline"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Finetuned peor que baseline"
          description: "El modelo finetuned tiene F1 menor que el baseline. Revisar el ultimo training."

      - alert: TenazasEvalFileStale
        expr: (time() - tenazas_eval_file_mtime_seconds) > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Eval results desactualizados (>24h)"
          description: "Último eval hace {{ $value | humanizeDuration }}. Correr eval_runner.py."
