# Proposed reversible drop-in only. Helper must preserve the baseline ExecStart
# arguments when generating it; these paths match the verified staging unit.
[Service]
WorkingDirectory=/opt/tenazas-mcp/releases/mcp-v2-staging
ExecStart=
ExecStart=/usr/bin/python3 -m workspace.runtime.mcp_readonly_gateway --token-file /opt/tenazas-mcp/secrets/mcp-internal-token --cert /opt/tenazas-mcp/tls/mcp.crt --key /opt/tenazas-mcp/tls/mcp.key --cache-root /var/lib/tenazas-mcp-v2
ReadWritePaths=
ReadOnlyPaths=/var/lib/tenazas-mcp-v2
ProtectSystem=strict
NoNewPrivileges=true
