version: "3.8"
services:
  openclaw:
    build: .
    container_name: openclaw
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Buenos_Aires}
      - NODE_OPTIONS=${NODE_OPTIONS:---dns-result-order=ipv4first}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE}
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD}
      - GOG_ACCOUNT=${GOG_ACCOUNT}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./state:/home/tenazas/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/piper/data:/home/tenazas/piper
      - ./startup.sh:/home/tenazas/startup.sh
      - ./auto-heal.sh:/home/tenazas/auto-heal.sh
      - ./ollama-check.sh:/home/tenazas/ollama-check.sh
      - ./tests:/home/tenazas/tests
      - ./workspace/runtime:/home/tenazas/runtime
      - ./himalaya-config:/home/tenazas/.config/himalaya
      - ./tools:/home/tenazas/tools
      - ./ssh-keys:/home/tenazas/.ssh:ro
      - ./gcal-token.json:/home/tenazas/.openclaw/gcal-token.json:ro
    command: ["bash", "/home/tenazas/startup.sh"]
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "5", "http://127.0.0.1:18789/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=false

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=1GB"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-tenazas}
      - GF_USERS_ALLOW_SIGN_UP=false

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8890:8080"
    environment:
      - TZ=America/Buenos_Aires
      - SEARXNG_BASE_URL=http://192.168.2.2:8890/

volumes:
  prometheus_data:
  grafana_data:
