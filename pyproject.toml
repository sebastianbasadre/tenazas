[project]
name = "tenazas-runtime"
version = "0.1.0"
description = "Tenazas/OpenClaw runtime, automation, and observability layer."
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client==2.196.0",
  "google-auth==2.53.0",
  "google-auth-oauthlib==1.4.0",
  "more-itertools==11.0.2",
  "numba==0.65.1",
  "openai-whisper==20250625",
  "prometheus-client==0.25.0",
  "pychromecast==14.0.10",
  "pycryptodome==3.23.0",
  "python-miio==0.5.12",
  "requests==2.34.2",
  "pypdf==6.14.2",
  "reportlab==5.0.0",
  "tiktoken==0.13.0",
  "tqdm==4.67.3",
  "tplinkrouterc6u==5.20.1",
  "websocket-client==1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
]
training = [
  "torch",
  "transformers",
  "datasets",
  "peft",
  "trl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "workspace", "workspace/runtime"]
addopts = "-q"
markers = [
  "linux_filesystem: Linux-only UID/GID, file modes, links and atomic publication checks",
  "integration: requires Docker, network services, container paths, or live homelab devices",
  "live: requires external APIs, Telegram, broker access, or real infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["workspace/runtime", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
